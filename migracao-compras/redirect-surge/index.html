<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O app mudou de endereço</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#171717;
       color:#e9edef;font-family:'Segoe UI',system-ui,sans-serif;padding:20px;text-align:center}
  .cartao{background:#232323;border:1px solid #2a3942;border-top:4px solid #f5b301;
          border-radius:14px;padding:34px 30px;max-width:420px}
  h1{font-size:18px;margin:0 0 10px}
  p{font-size:14px;color:#8696a0;line-height:1.6;margin:0 0 18px}
  a{display:inline-block;background:#f5b301;color:#1a1a1a;font-weight:700;
    padding:12px 22px;border-radius:9px;text-decoration:none}
</style>
</head>
<body>
  <div class="cartao">
    <h1>O app mudou de endereço</h1>
    <p>A Gestão de Pedidos e Compras agora fica em um endereço da Martins Notari.
       Estamos te levando para lá.</p>
    <p><b>Se você tem o app instalado</b>, desinstale e instale de novo pelo endereço novo.</p>
    <a href="https://compras.martinsnotari.com.br/">Ir para o endereço novo</a>
  </div>
<script>
/* Desliga o service worker antigo e limpa o cache ANTES de redirecionar.
   Sem isso, quem tem o app instalado continua abrindo a versão velha para
   sempre — o service worker serve do cache e nunca chega aqui. */
(function(){
  var destino='https://compras.martinsnotari.com.br/';
  var tarefas=[];
  try{
    if('serviceWorker' in navigator){
      tarefas.push(navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.map(function(r){ return r.unregister(); }));
      }));
    }
    if(window.caches){
      tarefas.push(caches.keys().then(function(ks){
        return Promise.all(ks.map(function(k){ return caches.delete(k); }));
      }));
    }
  }catch(e){}
  Promise.all(tarefas).catch(function(){}).then(function(){
    setTimeout(function(){ location.replace(destino); }, 600);
  });
})();
</script>
</body>
</html>
