[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mas"
version = "1.0.0"
description = "Motor de Auditoria de Suprimentos — indexação de diretrizes de compras e auditoria de solicitações contra o Sienge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# O motor tem um parser de reserva; PyYAML apenas amplia o YAML aceito no frontmatter.
yaml = ["PyYAML>=6.0"]

[project.scripts]
mas = "mas.cli:main"

[tool.setuptools]
packages = ["mas"]
